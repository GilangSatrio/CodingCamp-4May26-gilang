<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="theme-toggle" class="btn btn--ghost theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle light/dark mode">
    <span id="theme-icon" aria-hidden="true">🌙</span>
  </button>

  <main id="dashboard">

    <!-- Greeting Panel -->
    <section id="greeting-panel" class="panel" aria-label="Greeting and current time">
      <p id="greeting-message" aria-live="polite">Good morning</p>
      <time id="current-time" datetime="">00:00</time>
      <p id="current-date"></p>
      <div id="name-display" class="name-display">
        <span id="name-text"></span>
        <button id="name-edit-btn" class="btn btn--ghost name-edit-btn" type="button" aria-label="Edit your name">✏️</button>
      </div>
      <form id="name-edit-form" class="name-edit-form" novalidate hidden>
        <input id="name-input" type="text" class="name-input" placeholder="Enter your name"
               maxlength="40" autocomplete="given-name" aria-label="Your name" />
        <button type="submit" class="btn btn--primary">Save</button>
        <button type="button" id="name-cancel-btn" class="btn btn--ghost">Cancel</button>
      </form>
    </section>

    <!-- Focus Timer -->
    <section id="focus-timer" class="panel" aria-label="Focus timer">
      <h2 class="sr-only">Focus Timer</h2>
      <output id="timer-display" aria-live="polite" aria-atomic="true">25:00</output>
      <div class="timer-presets" role="group" aria-label="Timer duration presets">
        <button class="btn btn--ghost timer-preset" type="button" data-minutes="5">5m</button>
        <button class="btn btn--ghost timer-preset" type="button" data-minutes="15">15m</button>
        <button class="btn btn--primary timer-preset" type="button" data-minutes="25">25m</button>
        <button class="btn btn--ghost timer-preset" type="button" data-minutes="45">45m</button>
        <button class="btn btn--ghost timer-preset" type="button" data-minutes="60">60m</button>
      </div>
      <div class="timer-custom">
        <label for="timer-custom-input" class="sr-only">Custom minutes</label>
        <input id="timer-custom-input" type="number" class="timer-custom-input"
               min="1" max="999" placeholder="Custom min" aria-label="Custom duration in minutes" />
        <button id="timer-custom-set" class="btn btn--ghost" type="button">Set</button>
      </div>
      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button id="timer-start" class="btn btn--primary" type="button">Start</button>
        <button id="timer-stop"  class="btn btn--ghost"   type="button" disabled>Stop</button>
        <button id="timer-reset" class="btn btn--ghost"   type="button">Reset</button>
      </div>
      <p id="timer-notification" role="alert" aria-live="assertive" hidden>
        Time's up! Take a break.
      </p>
    </section>

    <!-- Task List -->
    <section id="task-list" class="panel" aria-label="Task list">
      <h2>Tasks</h2>
      <form id="task-add-form" novalidate>
        <label for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="What needs doing?"
               autocomplete="off" aria-describedby="task-input-error" />
        <span id="task-input-error" role="alert" aria-live="polite" hidden></span>
        <button type="submit" class="btn btn--primary">Add</button>
      </form>
      <ul id="task-items" aria-label="Tasks" aria-live="polite"></ul>
    </section>

    <!-- Quick Links -->
    <section id="quick-links" class="panel" aria-label="Quick links">
      <h2>Quick Links</h2>
      <form id="link-add-form" novalidate>
        <label for="link-label-input">Label</label>
        <input id="link-label-input" type="text" placeholder="e.g. GitHub"
               autocomplete="off" aria-describedby="link-label-error" />
        <span id="link-label-error" role="alert" aria-live="polite" hidden></span>

        <label for="link-url-input">URL</label>
        <input id="link-url-input" type="url" placeholder="https://example.com"
               autocomplete="off" aria-describedby="link-url-error" />
        <span id="link-url-error" role="alert" aria-live="polite" hidden></span>

        <button type="submit" class="btn btn--primary">Add Link</button>
      </form>
      <ul id="link-items" aria-label="Quick links" aria-live="polite"></ul>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
